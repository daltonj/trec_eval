# This workflow will install Python dependencies, and runs tests with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Continuous Integration

on:
  push:
  pull_request:

jobs:
  build:
    
    strategy:
      matrix:
        os: ['ubuntu-latest', 'windows-latest', 'macOs-latest']
        architecture: ['x64']

    runs-on: ${{ matrix.os }}
    steps:

    - uses: actions/checkout@v6
      with:
        submodules: 'recursive'

    - uses: ilammy/msvc-dev-cmd@v1
      if: matrix.os == 'windows-latest'

    - name: build-windows
      if: matrix.os == 'windows-latest'
      shell: cmd
      run: |
        call "%VS140COMNTOOLS%..\..\VC\vcvarsall.bat" x86_amd64
        set INCLUDE "C:/Program Files (x86)/Windows Kits/10/Include/10.0.10240.0/ucrt"
        build.bat
        dir trec_eval.exe

    - name: build-unix
      if: matrix.os == 'ubuntu-latest' || matrix.os == 'macOs-latest'
      run: |
        make

    - name: run-unix
      if: matrix.os == 'ubuntu-latest' || matrix.os == 'macOs-latest'
      run: |
        ./trec_eval -h

    - name: run-windows
      if: matrix.os == 'windows-latest'
      shell: cmd
      run: |
        trec_eval -h
    
    - name: test-unix
      if: matrix.os == 'ubuntu-latest' || matrix.os == 'macOs-latest'
      run: |
        make quicktest
        # longtest doesnt pass at present
        #make longtest
    
    - name: test-windows
      if: matrix.os == 'windows-latest'
      shell: cmd
      run: |
        quicktest.bat

  # Some regression scripts fail only in a sanitizer build, and the readers
  # and allocators must also work where long and size_t have 32 bits.
  checks:
    runs-on: ubuntu-latest
    steps:

    - uses: actions/checkout@v6

    - name: test-sanitizers
      # trec_eval leaves its memory to the system when it stops on an input
      # error, so leak checks would fail every refusal that the scripts test
      env:
        ASAN_OPTIONS: detect_leaks=0
      run: |
        make CC='gcc -fsanitize=address,undefined,float-cast-overflow -fno-sanitize-recover=all' quicktest

    - name: test-32-bit
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-multilib
        make clean
        make CC='gcc -m32' quicktest

    
